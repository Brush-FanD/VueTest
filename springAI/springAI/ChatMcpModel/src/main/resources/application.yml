server:
  port: 8082
  # 该服务会暴露发邮件等工具，务必只监听本机；确需局域网访问时再改为 0.0.0.0 并自行加鉴权
  address: 127.0.0.1
spring:
  application:
    name: spring-mcp-ai-server
  ai:
    mcp:
      server:
        name: spring-mcp-ai-server-sse
        version: 1.0.0
        sse-endpoint: /sse
        type: async
  mail:
    # 账号密码只从环境变量读取，禁止再写进代码仓库（启动前先设置 MAIL_USERNAME / MAIL_PASSWORD）
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      #邮箱协议
      #默认编码
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          ssl:
            enable: true


